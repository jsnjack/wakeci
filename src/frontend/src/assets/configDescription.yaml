desc: Ask a cow to say something smart
# 'params' are injected as environmetal variables
# The feed shows the params a build changed from these defaults, labels first
params:
  - SLEEP: 5
  - BRANCH_LABEL: main
# Labels are the params that say what a build is about: the feed shows their
# values first, and a search finds them by name, e.g. `branch=main`. Without
# `labels`, the params named *_LABEL are the labels. Values at their default
# aren't shown
labels: [BRANCH_LABEL]

tasks:
  - name: Waking up a cow
    run: sleep ${SLEEP}

  - name: Cow says
    run: fortune | cowsay
    # command in `run` is executed when the condition in `when` evaluates to `true`
    # The condition uses `[[` syntax from bash (https://devhints.io/bash#conditionals)
    when: $USER == joe
    # command in `run` is executed when the command in `if` has exit code 0
    if: test -f API.md
    env:
      DRY: false
      HTTPS: true
    # Set task status to `finished` even if exit code is not 0
    ignore_errors: yes

  # `include` adds tasks from external file. The value can be an absolute path or
  # a path relative to WAKE_CONFIG_DIR.
  # If `when`, `if` or `env` is specified, all included tasks inherit it
  - include: includes/notifications.yml
    env:
      DRY: false

  # `block` statement allows to group multiple tasks together
  # If `when`, `if` or `env` is specified, all tasks inside `block` statement inherit it
  - name: Install application
    block:
      - name: Install application with dnf
        run: dnf install wget

      - name: Print all installed packages
        run: dnf List
    env:
      DRY: false

  # Using secrets. Secrets allow you to store sensitive information in your wake
  # configuration files. Use `secretsfile` configuration option for wakeci to
  # specify the path to the file with secrets.
  #
  # In a job file, secrets are accessed using the `secrets` object. The `secrets`
  # object is a map of secret names to their values. Secrets can be accessed in
  # the `env` section, `params` section and `run` section. Wakeci will automatically
  # redact secrets from the build logs.
  - name: Example of using secrets
    run: echo "My secret is {{ secrets.MY_SECRET }} and my API key is {{ secrets.API_KEY }}"
    env:
      API_KEY: "{{ secrets.API_KEY }}"

# List of patterns according to https://golang.org/pkg/path/filepath/#Match
# related to the workspace directory
# Note:
#  - artifacts are collected only for builds with status `finished` or `failed`
#  - `on_finished`, `on_failed` tasks are executed before artifacts are collected
#  - `finally` tasks are executed after artifacts are collected
#  - HTML artifacts open sandboxed: their scripts run and their own files load,
#    but they can't call wakeci, open new windows or embed other pages
artifacts:
  - "*.tar.gz"

# Automatically run the job every configured interval (cron expression)
# More info https://godoc.org/github.com/robfig/cron
interval: "@daily"

# Abort the job if it takes more than specified amount of time to finish
# Valid time units are "ns", "us" (or "µs"), "ms", "s", "m", "h".
# The time counts from the start of the `on_running` tasks until the build
# ends, `finally` tasks included. A timeout works like an abort (see below);
# when it stops the main tasks, the build status is `timed out`
timeout: 5m30s

# Adjust build position in the queue
priority: 10

# Designates how many builds of the same job can be executed in parallel
# 0 - unlimited
concurrency: 0

# Counts the builds of every job with this key against `concurrency` (1 if
# it is 0), e.g. jobs that work on the same test server. The build's params
# fill in $NAME, and a param without a value means no key. A build that runs
# its on_aborted and finally tasks after an abort still counts, so a build
# waits until the one it cancelled has cleaned up. e.g. pr_init/$NAME
concurrency_key: ""

# A newer build cancels the older builds with the same key, of every job
# with this group, queued or running, with the builds they started. Their
# on_aborted and finally tasks run, and their log says "Aborted as
# superseded by #N". The build queued later wins; builds of one group never
# cancel each other. A param without a value means no key. e.g. tests/$BRANCH
cancel_group: ""
# While this command succeeds, the build cancels nothing. It gets the params
# as variables, e.g. '[[ $BRANCH =~ ^(main|release)$ ]]'
cancel_unless: ""

# Asks the tools of every task to print colours, which the build page shows:
# sets FORCE_COLOR=1, CLICOLOR_FORCE=1 and PY_COLORS=1, before the params and
# the task's `env`, which can set them otherwise. A task can set `color: true`
# on its own. Off by default, since a script that parses a tool's output
# would get the colour codes; task_N.log stays plain either way
color: true

# List of tasks executed on build's status change
# Available handlers:
#  - `on_pending` - when the status of the build changes to `pending`
#  - `on_running` - when the status of the build changes to `running`
#  - `on_aborted` - when the status of the build changes to `aborted` or `timed out`
#  - `on_failed` - when the status of the build changes to `failed`
#  - `on_finished` - when the status of the build changes to `finished`
# Note: If one of the commands failed, it doesn't fail the whole build
#
# An abort (by a user or the `timeout`) stops the task that runs, including a
# `when` or `if` check, and is kept until the build acts on it:
#  - while the build is queued or in `on_running` and main tasks: no more of
#    them run, the build is `aborted` and the `on_aborted` tasks run
#  - in `on_finished`, `on_failed` or `on_aborted` tasks: the rest of that
#    group is skipped and the build keeps its status
#  - `finally` tasks run in every case; an abort during them skips the rest
#
# If wakeci stops without ending a build, e.g. it was killed, it runs the
# build's remaining tasks when it starts again: `on_aborted` and `finally` if
# the build was running, otherwise the rest of the group it was in and
# `finally`. A task that had started doesn't run again. These tasks see
# WAKE_INTERRUPTED=true, so one that mustn't run late can skip itself:
# when: '"$WAKE_INTERRUPTED" != "true"'
on_pending:
  - name: Log a call
    run: logger "Looking for a suitable cow"

# List of tasks that are always executed
finally:
  - name: List all files
    run: ls -alh
# Default environmetal variables, inject by wake:
# "WAKE_BUILD_ID" - current build id, e.g. 169
# "WAKE_BUILD_STATUS" - status of the build when the task starts: `pending` in
#                       on_pending tasks, `running` in main and on_running tasks
#                       (even while an abort is on its way), and `failed`,
#                       `aborted`, "timed out" or `finished` in the tasks that run
#                       after the build stopped. on_aborted tasks run for both
#                       `aborted` and "timed out". Quote it in `when`, e.g.
#                       when: '"$WAKE_BUILD_STATUS" == "timed out"'
# "WAKE_BUILD_WORKSPACE" - path to the build's workspace, e.g. ~/workspace/169/
# "WAKE_JOB_NAME" - name of the job, e.g. ask_a_cow
# "WAKE_JOB_PARAMS" - URL encoded `params` of the job, e.g. "sleep=5&print=true"
# "WAKE_CONFIG_DIR" - path to the directory with all job configuration files,
#                     e.g. ~/jobs/
# "WAKE_URL" - URL of the service, e.g. https://myci.space/
# "WAKE_TOKEN" - the build's token, for the wake command, which every task has
#                on its PATH. It starts builds under this one and reads the
#                API, and stops working when the build ends:
#                  run: wake start deploy --inherit VERSION=2.1
#                  run: list_nodes | wake start check_node --each NODE
#                  run: wake start migrate --wait    # fails if it fails
#                  run: wake api /api/build/$WAKE_BUILD_ID
#                Everything is checked before the first build starts.
#                Run `wake help` for the options.
# "WAKE_SUMMARY" - path of a file for the build's summary. What tasks write
#                  there, e.g. the tests that failed, is shown on the build
#                  page as plain text and returned by the API, up to 64 KB,
#                  with secret values redacted as in the logs:
#                  echo "Failed: test_login" >> "$WAKE_SUMMARY"
#                  A test task can name the tests that failed and the value
#                  that runs only them again: Run again on the build page
#                  offers each NAME=VALUE whose NAME is one of the job's
#                  params. With a param TESTS: "" (all tests):
#                    run: |
#                      set -o pipefail
#                      if ! go test ./... -run "${TESTS:-.}" | tee test.log; then
#                        failed=$(grep -o -- '--- FAIL: [^ ]*' test.log | cut -d' ' -f3 | paste -sd'|' -)
#                        echo "Failed: $failed" >> "$WAKE_SUMMARY"
#                        echo "Run only them again with TESTS=^($failed)\$" >> "$WAKE_SUMMARY"
#                        exit 1
#                      fi
# "WAKE_INTERRUPTED" - `true` in the tasks a build runs after wakeci stopped
#                      without ending it (see on_aborted above), else `false`
# "WAKE_PARENT_ID" - id of the build that started this one, set only then:
#                    the builds `wake start` starts are shown below their
#                    build in the feed
#
# Set only after a main task failed, timed out or was aborted, so they reach
# the `on_failed`, `on_aborted` and `finally` tasks:
# "WAKE_FAILED_TASK_ID" - id of the task that stopped the build, e.g. 3
# "WAKE_FAILED_TASK_NAME" - name of that task, e.g. Run tests
# "WAKE_FAILED_TASK_LOG" - path to that task's output log, e.g. to send its
#                          last lines in a notification

# To modify or introduce new environmental variables during the build execution,
# create `build.env` file in WAKE_BUILD_WORKSPACE directory.
#
# Example:
# echo "{environment_variable_name}={value}" >> build.env
#
# There are multiple ways of defining environment for running tasks. If the same
# environmental variable is defined multiple times, the priority is:
#  - default OS env variables
#  - wake env variables `WAKE_*`
#  - variables from `params` section
#  - variables from `env` section
#  - variables from `build.env` file
#  - `WAKE_BUILD_STATUS`, `WAKE_FAILED_TASK_*` and `WAKE_INTERRUPTED`, which
#    nothing overrides, so hooks always see how the build really stopped
